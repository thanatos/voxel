[workspace]
members = [
	"assembly-script",
	"map",
	"map_gen",
	"mod",
]

[package]
name = "voxel"
version = "0.1.0"
authors = ["Roy Wellington Ⅳ <cactus_hugged@yahoo.com>"]
edition = "2018"

[dependencies]
anyhow = "1.0.55"
ash = "0.37.0"
bytemuck = "1.11.0"
clap = {version = "4.4.18", features = ["derive"]}
env_logger = "0.10"
freetype = "0.7.0"
log = "0.4.8"
png = "0.17.2"
sdl2 = "0.35.0"
smallvec = "1.8.0"
thiserror = "1.0.30"
vulkano = "0.32.0"
vulkano-shaders = "0.32.0"
uuid = "1"

[dev-dependencies]
criterion = "0.4"

[[bench]]
name = "text_rendering"
harness = false
